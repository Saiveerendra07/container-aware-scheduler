name: Build and test

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dashboard and plotting dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dashboard.txt matplotlib

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Build CPU workloads
        run: make workloads

      - name: Run automated tests
        run: python -m unittest discover -s tests -v
